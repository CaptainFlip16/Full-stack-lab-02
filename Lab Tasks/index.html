<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Showcase - Completed Lab Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="team">
    <h2 class="team-title">Meet the Team</h2>

    <!-- Task 1: 3-item flex row using flex-wrap and gap -->
    <div class="card-row">
        <div class="card">
            <!-- Task 2: Positioned badge on relative card parent -->
            <!-- Task 3: ::before icon applied on badge -->
            <span class="badge">Featured</span>
            <!-- Task 4: Avatar with hover grayscale transition -->
            <div class="avatar"></div>
            <h3>Junaid Khan</h3>
            <p class="role">Backend Developer</p>
        </div>

        <div class="card">
            <div class="avatar"></div>
            <h3>Rashid Mehmood</h3>
            <p class="role">UI/UX Designer</p>
        </div>

        <div class="card">
            <div class="avatar"></div>
            <h3>Zainab Ali</h3>
            <p class="role">Backend Developer</p>
        </div>
    </div>

    <!-- Task 5: Button row built using Bootstrap flex utility classes -->
    <div class="actions d-flex flex-wrap justify-content-center gap-3">
        <button class="btn btn-outline-primary">Contact</button>
        <button class="btn btn-outline-primary">View Portfolio</button>
        <button class="btn btn-outline-primary">Share</button>
    </div>
</section>

</body>
</html>
